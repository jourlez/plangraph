name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: tag must match plugin.json and be on main
        run: |
          V="${GITHUB_REF_NAME#v}"
          test "$(node -p "JSON.parse(process.getBuiltinModule('fs').readFileSync('.claude-plugin/plugin.json','utf8')).version")" = "$V"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: reproducible source tarball
        run: |
          V="${GITHUB_REF_NAME#v}"
          git archive --format=tar --prefix="project-brain-$V/" "$GITHUB_SHA" | gzip -n > "project-brain-$V.tar.gz"
          sha256sum "project-brain-$V.tar.gz" > "project-brain-$V.tar.gz.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: project-brain-*.tar.gz
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" project-brain-*.tar.gz project-brain-*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --notes "Commit: $GITHUB_SHA"
