name: ci
# Parallel jobs so that no single job is long (wall time to a green result is what counts). Every test file runs on Linux in exactly one
# of `unit` (with the coverage floors) and `slow` (no coverage); scripts/ci-tests.ts makes the split and test/ci-tests.test.ts pins it.
# Only `release-dry-run` waits for other jobs. `compat` and `floor` run the supported newer Node majors and the old ones the session hook must survive.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    name: unit tests with coverage (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 4 minutes
    strategy:
      fail-fast: false
      matrix:
        node: ['24'] # the floor major (engines.node is >=24.15); add a newer major here to test it too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # test/public-clean.test.ts checks the author of every commit of the branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # test/types.test.ts runs tsc from node_modules
      - name: install dev-only tools (typescript, @types/node, biome, lefthook, knip; exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-fund
      - name: unit tests with coverage ratchet (the coverage group; the floors live in scripts/test-coverage.ts, raise them when coverage rises, never lower)
        run: node scripts/test-coverage.ts --group coverage
  slow:
    name: solver, evals and icon tests, smoke (ubuntu, python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 4 minutes
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14'] # requires-python of bin/plangraph-solve is >=3.10,<3.15: both bounds
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # the solver tests and the solver part of the smoke test need uv; they run here only (they skip cleanly without uv)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: false
      - name: smoke (first, so it also builds the solver environment the solver tests reuse)
        run: npm run smoke
      - name: hostile working directory (the uv run fallback never runs a planted interpreter; real uv)
        env:
          PLANGRAPH_SOLVE_LAUNCH: uv-run
          UV_OFFLINE: '1'
          UV_PYTHON_DOWNLOADS: never
        run: |
          set -euo pipefail
          unset UV_PYTHON
          base="$RUNNER_TEMP/hostile"
          rm -rf "$base"
          mkdir -p "$base/repo/.venv/bin" "$base/repo/evil" "$base/marks" "$base/home" "$base/cache"
          cd "$base/repo"
          printf '#!/bin/sh\necho ran > "%s/venv"\nexit 1\n' "$base/marks" > .venv/bin/python
          printf '#!/bin/sh\necho ran > "%s/pyver"\nexit 1\n' "$base/marks" > evil/python3
          chmod +x .venv/bin/python evil/python3
          ln -s python .venv/bin/python3
          printf 'home = /usr/bin\nimplementation = CPython\nversion_info = 3.12.0\ninclude-system-site-packages = false\n' > .venv/pyvenv.cfg
          printf './evil/python3\n' > .python-version
          printf 'index-url = "https://evil.invalid/simple"\n' > uv.toml
          HOME="$base/home" UV_CACHE_DIR="$base/cache" "$GITHUB_WORKSPACE/bin/plangraph-solve-run" --help >/dev/null 2>&1 || true
          test -z "$(ls -A "$base/marks")" || { echo "a planted interpreter ran:"; ls "$base/marks"; exit 1; }
      - name: no-coverage test group (slow files that reach no lib/ or src/ code the coverage group does not; one Python leg is enough)
        if: matrix.python == '3.14'
        run: |
          files=$(node scripts/ci-tests.ts nocoverage)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test $files
      - name: timing group (size-ratio tests, run alone and serially so parallel load cannot fail them; no coverage and no npm ci because they read no node_modules)
        if: matrix.python == '3.14'
        run: |
          files=$(node scripts/ci-tests.ts timing)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test --test-concurrency=1 $files
  static:
    name: typecheck, lint, knip, shellcheck, actionlint, package contents, plugin layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: install shellcheck 0.11.0 and actionlint 1.7.12 (release tarballs, SHA-256 checked, first on PATH, so the runner image decides nothing)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/tools/bin"
          mkdir -p "$bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSL --retry 3 -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 shellcheck-v0.11.0/shellcheck
          mv shellcheck "$bin/shellcheck"
          curl -fsSL --retry 3 -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          mv actionlint "$bin/actionlint"
          echo "$bin" >> "$GITHUB_PATH"
      - name: plugin layout
        run: npm run validate:plugin
      - name: install dev-only tools (typescript, @types/node, biome, lefthook, knip; exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-fund
      - name: audit (high and critical advisories fail the job)
        run: npm audit --audit-level=high
      - name: typecheck (tsc over tsconfig.json and tsconfig.prod.json, any error fails)
        run: npm run typecheck
      - name: biome lint (lint rules only, formatter disabled)
        run: npm run lint:check
      - name: knip (unused files, exports and dependencies)
        run: npm run knip
      - name: actionlint (runs the pinned shellcheck over every run block)
        run: actionlint -shellcheck "$RUNNER_TEMP/tools/bin/shellcheck"
      - name: shellcheck over the shell scripts
        env:
          PLANGRAPH_REQUIRE_TOOLS: '1'
        run: npm run lint:sh
      - name: package contents (git archive HEAD holds nothing private and every file the plugin needs)
        run: node scripts/check-package.ts
      # the package is fetched outside the lockfile, so its integrity is not pinned (decision D16); its own postinstall must run, it fetches the
      # native binary. No secret is in this step's environment, and the validator needs no login (measured).
      - name: claude plugin validate (pinned Claude Code, no login)
        run: npx --yes @anthropic-ai/claude-code@2.1.329 plugin validate . --strict
  macos:
    name: macos tests (shard ${{ matrix.shard }}/2, node 24)
    runs-on: macos-latest
    timeout-minutes: 15 # estimated about 2 minutes per shard
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the portable group runs test/public-clean.test.ts, whose commit-author check needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # test/types.test.ts runs tsc from node_modules
      - name: install dev-only tools (typescript, @types/node, biome, lefthook, knip; exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-fund
      - name: portable test group, one shard (every test file but the Linux-only solver; coverage is measured by the unit job)
        run: |
          files=$(node scripts/ci-tests.ts portable)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test --test-shard=${{ matrix.shard }}/2 $files
      - name: smoke on macOS (BSD userland; the solver part needs uv and runs in the slow job)
        if: matrix.shard == 1
        run: npm run smoke
  compat:
    name: portable tests on node ${{ matrix.node }} (ubuntu, no runtime warning)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 3 minutes
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '26'] # the floor and the newest major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the portable group runs test/public-clean.test.ts, whose commit-author check needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install dev-only tools (typescript, @types/node, biome, lefthook, knip; exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-fund
      # Node writes every runtime warning of this process and of every child the tests spawn to the file instead of stderr, so a warning that
      # a user would see (ExperimentalWarning, a DEP00xx deprecation) leaves the file non-empty and fails the job.
      - name: portable test group; any Node runtime warning fails
        env:
          NODE_OPTIONS: --redirect-warnings=${{ runner.temp }}/w.log
        run: |
          files=$(node scripts/ci-tests.ts portable)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test $files
          if [ -s "$RUNNER_TEMP/w.log" ]; then echo "Node runtime warnings:"; cat "$RUNNER_TEMP/w.log"; exit 1; fi
  floor:
    name: session hook on node ${{ matrix.node }} (ubuntu, below or at the floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20.9.0', '24.14.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # No npm ci: the hook runs where nothing was installed. It must exit 0, write nothing, and print at most the one floor line in total
      # (T11 prints it on stdout only), never anything else. The hook runs src/entry.js: the extensionless launcher is refused on Node 18 and 20.0 to 20.9 before any code runs.
      - name: SessionStart hook exits 0 with at most the floor line
        run: |
          out="$RUNNER_TEMP/hook.out"; err="$RUNNER_TEMP/hook.err"
          rc=0
          node src/entry.js card --if-present --refresh >"$out" 2>"$err" || rc=$?
          echo "exit $rc"; echo "--- stdout"; cat "$out"; echo "--- stderr"; cat "$err"
          test "$rc" = 0
          test ! -s "$err"
          test "$(grep -c '' "$out")" = 1
          grep -Eq '^plangraph: needs Node >= 24\.15, found v' "$out"
          test -z "$(git status --porcelain)"
  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 3 minutes (mutants run on min(cores, 4) workers)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # the mutants run the solver tests, which need uv
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: mutation run (every listed mutant must be killed; exits non-zero on a survivor or a stale mutation)
        run: npm run mutate
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # gitleaks-action lists a pull request's commits through the API, so it needs pull-requests: read besides contents: read.
    # Repositories owned by an organization also need a GITLEAKS_LICENSE secret (see SECURITY.md); this repo passes none.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release-dry-run:
    name: release dry run (tarball, checksum, package contents; nothing is published)
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    needs: [unit, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: reproducible source tarball and checksum
        run: |
          git archive --format=tar --prefix="plangraph-dry/" "$GITHUB_SHA" | gzip -n > "$RUNNER_TEMP/plangraph-dry.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum plangraph-dry.tar.gz > plangraph-dry.tar.gz.sha256 && sha256sum -c plangraph-dry.tar.gz.sha256)
      - name: package contents
        run: node scripts/check-package.ts
