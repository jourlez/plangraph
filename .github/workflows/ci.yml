name: ci
# Parallel jobs so that no single job is long (wall time to a green result is what counts). Every test file runs on Linux in exactly one
# of `unit` (with the coverage floors) and `slow` (no coverage); scripts/ci-tests.ts makes the split and test/ci-tests.test.ts pins it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    name: unit tests with coverage (ubuntu, node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 4 minutes
    strategy:
      fail-fast: false
      matrix:
        node: ['24'] # the floor major (engines.node is >=24.2); add a newer major here to test it too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests with coverage ratchet (the coverage group; raise these floors when coverage rises, never lower)
        run: |
          files=$(node scripts/ci-tests.ts coverage)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test --experimental-test-coverage --test-coverage-include='lib/**' --test-coverage-include='src/**' --test-coverage-lines=99 --test-coverage-branches=95 --test-coverage-functions=98 $files
  slow:
    name: solver, evals and icon tests, smoke (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 4 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # the solver tests and the solver part of the smoke test need uv; they run here only (they skip cleanly without uv)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: smoke (first, so it also builds the solver environment the solver tests reuse)
        run: npm run smoke
      - name: no-coverage test group (slow files that reach no lib/ or src/ code the coverage group does not)
        run: |
          files=$(node scripts/ci-tests.ts nocoverage)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test $files
  static:
    name: typecheck, lint, plugin layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: plugin layout
        run: npm run validate
      - name: install dev-only tools (typescript, @types/node, biome, lefthook, knip; exact versions from package-lock.json)
        run: npm ci --ignore-scripts --no-fund
      - name: audit (high and critical advisories fail the job)
        run: npm audit --audit-level=high
      - name: typecheck (tsc over tsconfig.json and tsconfig.prod.json, any error fails)
        run: npm run typecheck
      - name: biome lint (lint rules only, formatter disabled)
        run: npm run lint:check
      - name: bulletproof check (lint, typecheck, full test suite)
        run: npm run bulletproof:check
      - name: claude plugin validate
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo "::notice::claude CLI not installed on this runner, plugin validate skipped"
          fi
  macos:
    name: macos tests (shard ${{ matrix.shard }}/2, node 24)
    runs-on: macos-latest
    timeout-minutes: 15 # estimated about 2 minutes per shard
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: portable test group, one shard (every test file but the Linux-only solver; coverage is measured by the unit job)
        run: |
          files=$(node scripts/ci-tests.ts portable)
          test -n "$files"
          # shellcheck disable=SC2086 # the list is split on purpose: one argument per test file (no spaces in test file names)
          node --test --test-shard=${{ matrix.shard }}/2 $files
      - name: smoke on macOS (BSD userland; the solver part needs uv and runs in the slow job)
        if: matrix.shard == 1
        run: npm run smoke
  mutation:
    name: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # estimated about 3 minutes (mutants run on min(cores, 4) workers)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # the mutants run the solver tests, which need uv
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: mutation run (every listed mutant must be killed; exits non-zero on a survivor or a stale mutation)
        run: npm run mutate
  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # gitleaks-action lists a pull request's commits through the API, so it needs pull-requests: read besides contents: read.
    # Repositories owned by an organization also need a GITLEAKS_LICENSE secret (see SECURITY.md); this repo passes none.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
